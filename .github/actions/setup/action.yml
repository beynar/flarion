name: Set up Flarion
description: >
  Install this repository's dependencies. sveltekit-cloudflare-worker is vendored as
  vendor/sveltekit-cloudflare-worker-0.0.1.tgz (it is not on npm), so no sibling checkout is needed.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.32.1
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
